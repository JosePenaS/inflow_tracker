name: Trend radar

on:
  workflow_dispatch:
  # GitHub schedules run in UTC and are often started late (sometimes
  # hours late). So instead of exact times we wake up every hour and run
  # once per time slot: the first wake-up after 11:00 Chile time does the
  # morning run, the first after 17:00 does the evening run, and every
  # other wake-up stops after a few seconds. A late start just means a
  # later run, never a skipped one.
  # Covers 10:17-23:17 Chile time in winter (UTC-4) and 11:17-23:17 in
  # summer (UTC-3).
  schedule:
    - cron: "17 14-23 * * *"
    - cron: "17 0-3 * * *"

permissions:
  contents: write

concurrency:
  group: trend-radar
  cancel-in-progress: false

env:
  # Slot start hours, Chile time. Each slot lasts until the next one
  # starts (the last one until midnight).
  SLOT_START_HOURS_CHILE: "11,17"

jobs:
  radar:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check run time
        id: gate
        shell: pwsh
        run: |
          try {
            $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("America/Santiago")
          } catch {
            $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("Pacific SA Standard Time")
          }
          $local = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $today = $local.ToString("yyyy-MM-dd")
          Write-Host "Chile time now: $($local.ToString('yyyy-MM-dd HH:mm'))"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "Started by hand: running."
            "run=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $starts = $env:SLOT_START_HOURS_CHILE -split "," |
            ForEach-Object { [int]$_.Trim() } | Sort-Object

          # Which slot are we in right now?
          $slot = $null
          foreach ($s in $starts) { if ($local.Hour -ge $s) { $slot = $s } }
          if ($null -eq $slot) {
            Write-Host "Before the first slot of the day; skipping."
            "run=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $next = $starts | Where-Object { $_ -gt $slot } | Select-Object -First 1
          if ($null -eq $next) { $next = 24 }

          # Has a run already happened in this slot today? (run_log.csv has
          # one row per search, with run_time_chile like "2026-11-05 11:23")
          $done = $false
          if (Test-Path "data/run_log.csv") {
            foreach ($row in Import-Csv "data/run_log.csv") {
              $t = $row.run_time_chile
              if ($t -and $t.Length -ge 13 -and $t.Substring(0, 10) -eq $today) {
                $h = [int]$t.Substring(11, 2)
                if ($h -ge $slot -and $h -lt $next) { $done = $true; break }
              }
            }
          }

          if ($done) {
            Write-Host "The $($slot):00 slot already ran today; skipping."
            "run=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "First wake-up in the $($slot):00 slot today: running."
            "run=true" >> $env:GITHUB_OUTPUT
          }

      - name: Set up R
        if: steps.gate.outputs.run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        if: steps.gate.outputs.run == 'true'
        shell: Rscript {0}
        run: |
          packages <- c("dplyr", "readr", "purrr", "tibble", "stringr",
                        "jsonlite", "DT", "htmltools", "knitr", "rmarkdown")
          missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) install.packages(missing, repos = "https://cloud.r-project.org")

      - name: Run trend radar
        if: steps.gate.outputs.run == 'true'
        shell: Rscript {0}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          source("run_radar.R", echo = FALSE)

      # The steps below also run when the radar step failed (e.g. Google
      # rate-limited every request), so the run log and the health page
      # still get updated. The workflow is still marked as failed.

      - name: Commit data
        if: always() && steps.gate.outputs.run == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          $changes = git diff --cached --name-only
          if ($changes) {
            git commit -m "Radar run $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Set up Quarto
        if: always() && steps.gate.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish dashboard
        if: always() && steps.gate.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
